name: generate arcade contribution graphs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install pacman contribution graph
        run: npm install -g pacman-contribution-graph

      - name: generate contribution graph SVGs
        run: |
          mkdir -p dist
          pacman-contribution-graph --platform github --username "${{ github.repository_owner }}" --game pacman --gameTheme github --output dist/pacman-contribution-graph.svg
          pacman-contribution-graph --platform github --username "${{ github.repository_owner }}" --game pacman --gameTheme github-dark --output dist/pacman-contribution-graph-dark.svg

      - name: publish SVGs to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin output:output || true

          rm -rf output-branch
          if git show-ref --verify --quiet refs/heads/output; then
            git worktree add output-branch output
          else
            git worktree add -b output output-branch
          fi

          find output-branch -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp dist/*.svg output-branch/

          cd output-branch
          git add *.svg
          git commit -m "Update arcade contribution graphs" || echo "No changes to commit"
          git push origin output
